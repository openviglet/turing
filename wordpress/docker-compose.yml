# A throwaway WordPress and Turing for trying the plugin end to end: run-docker.cmd drives it.
#
# src/ is mounted as the plugin, so an edit shows up on the next page load with no build.
# WordPress, its database and Turing's store live in named volumes; `run-docker.cmd reset`
# drops them. The plugin reaches Turing as http://turing:2700; the console is on
# http://localhost:2700 (admin / the TURING_ADMIN_PASSWORD below).

name: viglet-dumont-wp

services:
  # Turing as trabalharei runs it for development: embedded H2, Lucene and Artemis, plain HTTP,
  # single tenant, local login. TURING_IMAGE picks a locally built image (run-docker.cmd uses
  # turing-ce:local when it exists).
  turing:
    image: ${TURING_IMAGE:-ghcr.io/openviglet/turing-ce:latest}
    ports:
      - "127.0.0.1:${TURING_PORT:-2700}:2700"
    environment:
      PORT: 2700
      TURING_AI_CRYPTO_KEY: viglet-dumont-wp-dev-only
      # Applied only while no password is stored: changing it later needs `run-docker.cmd reset`.
      TURING_ADMIN_PASSWORD: ${TURING_ADMIN_PASSWORD:-dumont-dev}
      TURING_KEYCLOAK: "false"
      TURING_TENANCY_ENABLED: "false"
      TURING_TENANCY_AUTOPROVISION: "false"
      TURING_OPEN_BROWSER: "false"
      TURING_URL: http://localhost:${TURING_PORT:-2700}
      TURING_ALLOWEDORIGINS: http://localhost:${WP_PORT:-8080},http://localhost:${WP_MS_PORT:-8081},http://localhost:${TURING_PORT:-2700}
      # In-memory broker: no journal lock (AMQ219007) when the container is recreated.
      SPRING_ARTEMIS_EMBEDDED_PERSISTENT: "false"
      # Generative AI (answers, chat, summaries): with a key in the shell, a boot that finds no
      # LLM instance creates one, a default AI agent with RAG and a local embedding store.
      # Unset: no AI, search works as before.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TURING_STARTUP_DEFAULT_LLM_MODEL: ${TURING_STARTUP_DEFAULT_LLM_MODEL:-gpt-4o-mini}
      # The OpenAI-compatible gateway (/v1/chat/completions), as trabalharei enables it.
      TURING_GATEWAY_ENABLED: "true"
    volumes:
      - turing:/app/store
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/2700' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 20

  wordpress:
    image: wordpress:7.1.3-php8.5-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      # WP-Cron's loopback calls the site URL, localhost:${WP_PORT}, which nothing answers
      # inside the container. The cron service below runs due events instead, as a host
      # with a system cron does.
      WORDPRESS_CONFIG_EXTRA: define( 'DISABLE_WP_CRON', true );
      # The plugin's connection, from the environment as a container deploy sets it (D151):
      # read-only in the admin and never stored. The API key is minted on the first run and
      # stored in the option instead, since it does not exist before Turing does.
      VIGLET_DUMONT_TURING_URL: http://turing:2700
      VIGLET_DUMONT_TURING_SITE: ${SN_SITE:-Sample}
      VIGLET_DUMONT_TURING_LOCALE: ${TURING_LOCALE:-en_US}
      # Browsers reach Turing on the host port, not on the compose network's name.
      VIGLET_DUMONT_PUBLIC_URL: http://localhost:${TURING_PORT:-2700}
    volumes:
      - wp:/var/www/html
      - ./src:/var/www/html/wp-content/plugins/viglet-dumont
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The system cron: runs due WP-Cron events (the plugin's queue worker among them) every 15s.
  cron:
    image: wordpress:cli-2.12-php8.5
    depends_on:
      - wordpress
    user: "33:33"
    environment: *wp-env
    entrypoint: ["sh", "-c", "while true; do wp core is-installed 2>/dev/null && wp cron event run --due-now --quiet; sleep 15; done"]
    volumes:
      - wp:/var/www/html
      - ./src:/var/www/html/wp-content/plugins/viglet-dumont
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # WP-CLI over the same files and database: `run-docker.cmd wp <command>`.
  # tests/e2e/fixtures is the browser tests' seed data (npm run test:e2e).
  cli:
    image: wordpress:cli-2.12-php8.5
    profiles: ["cli"]
    depends_on:
      - wordpress
    user: "33:33"
    environment: *wp-env
    volumes:
      - wp:/var/www/html
      - ./src:/var/www/html/wp-content/plugins/viglet-dumont
      - ./tests/e2e/fixtures:/e2e:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # A multisite network beside the single site, for the browser tests (D161): its own
  # WordPress and database on WP_MS_PORT, the same Turing, and its own SN site (SN_MS_SITE)
  # that both of its sites share, each under its own site key. `run-docker.cmd multisite`
  # starts and installs it; nothing here runs without that profile.
  db-ms:
    image: mariadb:11.4
    profiles: ["multisite"]
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-ms:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 20

  wordpress-ms:
    image: wordpress:7.1.3-php8.5-apache
    profiles: ["multisite"]
    depends_on:
      db-ms:
        condition: service_healthy
    ports:
      - "${WP_MS_PORT:-8081}:80"
    environment: &wp-ms-env
      <<: *wp-env
      WORDPRESS_DB_HOST: db-ms
      VIGLET_DUMONT_TURING_SITE: ${SN_MS_SITE:-Network}
    volumes:
      - wp-ms:/var/www/html
      - ./src:/var/www/html/wp-content/plugins/viglet-dumont
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The system cron for every site of the network, not only the main one.
  cron-ms:
    image: wordpress:cli-2.12-php8.5
    profiles: ["multisite"]
    depends_on:
      - wordpress-ms
    user: "33:33"
    environment: *wp-ms-env
    entrypoint: ["sh", "-c", "while true; do wp core is-installed --network 2>/dev/null && for u in $$(wp site list --field=url); do wp --url=$$u cron event run --due-now --quiet; done; sleep 15; done"]
    volumes:
      - wp-ms:/var/www/html
      - ./src:/var/www/html/wp-content/plugins/viglet-dumont
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cli-ms:
    image: wordpress:cli-2.12-php8.5
    profiles: ["cli"]
    user: "33:33"
    environment: *wp-ms-env
    volumes:
      - wp-ms:/var/www/html
      - ./src:/var/www/html/wp-content/plugins/viglet-dumont
      - ./tests/e2e/fixtures:/e2e:ro
      - ./bin/multisite.htaccess:/dumont/multisite.htaccess:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db:
  wp:
  turing:
  db-ms:
  wp-ms:
