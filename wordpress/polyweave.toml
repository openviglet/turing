# polyweave (github.com/alegauss/polyweave) buys the demo store's photos (D265): one per
# product and guide, bought by bin/demo-photos.mjs inside the budget below and kept in
# polyweave's ledger. The demo video's narration, music and thumbnail moved to the marketing
# repository (marketing/turing/wordpress) with their own polyweave project and ledger.

[layers]
on = ["picture"]

[project]
name = "viglet-turing-wordpress"

# The demo store's photos (D265): one per product and guide, bought by bin/demo-photos.mjs.
[service.ideogram]
base    = "https://api.ideogram.ai"
key_env = "IDEOGRAM_API_KEY"
prices  = { "4.0" = 0.06, "4.0:TURBO" = 0.03 }

# The owner asked for them (2026-10-31): 68 pictures at 0.06 is about USD 4. Raised to 8.0
# by the owner (2026-11-04) after retakes for the scenes (tents on flat ground, clothing as
# a flat lay) spent the margin.
[budget.ideogram]
amount  = 8.0
unit    = "USD"
expires = "2026-12-31"
