# polyweave (github.com/alegauss/polyweave) speaks the demo video's narration (D246): one
# take per chapter and language, bought from ElevenLabs inside the budget below and kept in
# polyweave's ledger. `node bin/story-narration.mjs` drives it; the takes are committed
# under demo/narration/, so building the video spends nothing.

[layers]
on = ["sound", "picture"]

[project]
name = "viglet-dumont-wordpress"

[service.elevenlabs]
base    = "https://api.elevenlabs.io"
key_env = "ELEVENLABS_API_KEY"
# A sound (the video's music bed) is about 20 credits a second: 30 s is ~600 credits,
# about USD 0.10 on the Starter plan, held here at a conservative 0.20 a call.
prices  = { "eleven_v3" = { per = "character", rate = 0.00003 }, "eleven_multilingual_v2" = { per = "character", rate = 0.00003 }, "eleven_text_to_sound_v2" = 0.20 }

# The owner's ceiling for the narration (2026-10-31): the whole script is about 1,500
# characters, a few cents.
[budget.elevenlabs]
amount  = 2.0
unit    = "USD"
expires = "2026-12-31"

# The demo store's photos (D265): one per product and guide, bought by bin/demo-photos.mjs.
[service.ideogram]
base    = "https://api.ideogram.ai"
key_env = "IDEOGRAM_API_KEY"
prices  = { "4.0" = 0.06, "4.0:TURBO" = 0.03 }

# The owner asked for them (2026-10-31): 68 pictures at 0.06 is about USD 4. Raised to 8.0
# by the owner (2026-11-04) after retakes for the scenes (tents on flat ground, clothing as
# a flat lay) spent the margin.
[budget.ideogram]
amount  = 8.0
unit    = "USD"
expires = "2026-12-31"
