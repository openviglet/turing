# T1358 - the runtime ArchUnit import Spring Modulith runs at startup (module
# identifiers for the event publication registry, T1324; per-module tracing, T1327).
#
# Modulith only needs Turing's own types to tell which module a class belongs to,
# but ArchUnit's default resolves every class those types reference from the
# classpath (Spring, Spring AI, Lucene, Hazelcast, ...). That transitive import
# needed more than a 768 MB heap, so a fresh container with 1 GB of memory died
# with OutOfMemoryError before Tomcat started. Referenced classes outside the
# import become stubs instead.
#
# The build-time module verification keeps full resolution: test resources carry
# their own archunit.properties, which comes first on the test classpath.
resolveMissingDependenciesFromClassPath=false
