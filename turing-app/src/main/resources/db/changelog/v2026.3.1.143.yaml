databaseChangeLog:
  # --- Viglet AI vendor website: back to turing.viglet.org ---
  # The site returns to its custom domain (https://turing.viglet.org). Repoint the
  # VIGLET vendor row that v2026.3.1.138 moved to GitHub Pages on existing installs.
  # Fresh installs already get the new URL from TurLLMVendorOnStartup. Idempotent:
  # skipped unless the row still carries the GitHub Pages URL.
  - changeSet:
      id: v2026.3.1.143-01-viglet-ai-vendor-website
      author: viglet-team
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: "1"
          sql: "SELECT COUNT(*) FROM llm_vendor WHERE id = 'VIGLET' AND website = 'https://openviglet.github.io/turing'"
      changes:
        - update:
            tableName: llm_vendor
            columns:
              - column:
                  name: website
                  value: "https://turing.viglet.org"
            where: "id = 'VIGLET' AND website = 'https://openviglet.github.io/turing'"
