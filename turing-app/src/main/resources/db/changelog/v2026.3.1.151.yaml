databaseChangeLog:
  # --- T1319: optimistic locking on the infrastructure aggregates ---
  # The version Hibernate's @Version compares on save. Existing rows start at 0.
  # Idempotent: each changeSet is gated by columnExists.
  - changeSet:
      id: v2026.3.1.151-01-llm-instance-version
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: llm_instance
                columnName: version
      changes:
        - addColumn:
            tableName: llm_instance
            columns:
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
  - changeSet:
      id: v2026.3.1.151-02-embedding-model-version
