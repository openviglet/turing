- changeSet:
    id: searchengine-foreign-keys
    author: turing
    changes:
    - addForeignKeyConstraint:
        baseTableName: se_instance
        baseColumnNames: se_vendor_id
        constraintName: FKiss7849oscxvhac2gofthw6wh
