            constraints:
              nullable: false
        - column:
            name: icon
            type: varchar(150)
        - column:
            name: tenantId
            type: varchar(40)
        - column:
            name: version
            type: bigint
            defaultValueNumeric: '0'
            constraints:
              nullable: false
- changeSet:
