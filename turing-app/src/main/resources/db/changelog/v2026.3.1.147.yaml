databaseChangeLog:
  # --- T1317: one table-naming rule, <module>_<entity> ---
  # Every table takes its module as a prefix (se for searchengine), so the owner of a
  # table is readable from the schema alone. Each rename is idempotent: it runs only
  # while the old table exists and the new one does not. Columns, indexes and
  # constraints keep their names; only tables move.
  - changeSet:
      id: v2026.3.1.147-01-rename-ai_agent
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: ai_agent
        - not:
            - tableExists:
                tableName: agent
      changes:
        - renameTable:
            oldTableName: ai_agent
            newTableName: agent
