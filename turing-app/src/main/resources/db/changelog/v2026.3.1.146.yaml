databaseChangeLog:
  # --- T1330: the SN site's time zone for relative dates ---
  # An IANA id (America/Sao_Paulo) that "today", "tomorrow" and "this weekend" are
  # resolved in. Nullable: existing sites keep the server's zone. Idempotent: gated
  # by columnExists.
  - changeSet:
      id: v2026.3.1.146-01-sn-site-time-zone
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: sn_site
                columnName: timeZone
      changes:
        - addColumn:
            tableName: sn_site
            columns:
              - column:
                  name: timeZone
                  type: varchar(64)
