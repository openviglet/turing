databaseChangeLog:
  # --- T1319: audit dates on the versioned console aggregates (ADR 0005 section 7) ---
  # Their hand-rolled dates move to TurAuditable's columns: creationDate, lastModifiedDate,
  # createdBy and lastModifiedBy. The old date columns are renamed, so existing values
  # survive. Idempotent: each changeSet is gated by columnExists.
  - changeSet:
      id: v2026.3.1.155-01-chat_analytics_intent-createdAt-to-creationDate
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: chat_analytics_intent
            columnName: createdAt
        - not:
            - columnExists:
                tableName: chat_analytics_intent
                columnName: creationDate
      changes:
        - renameColumn:
            tableName: chat_analytics_intent
            oldColumnName: createdAt
            newColumnName: creationDate
            columnDataType: timestamp
  - changeSet:
      id: v2026.3.1.155-02-chat_analytics_intent-updatedAt-to-lastModifiedDate
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: chat_analytics_intent
            columnName: updatedAt
        - not:
            - columnExists:
                tableName: chat_analytics_intent
                columnName: lastModifiedDate
      changes:
        - renameColumn:
            tableName: chat_analytics_intent
            oldColumnName: updatedAt
            newColumnName: lastModifiedDate
            columnDataType: timestamp
  - changeSet:
      id: v2026.3.1.155-03-chat_analytics_intent-createdBy
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: chat_analytics_intent
                columnName: createdBy
      changes:
        - addColumn:
            tableName: chat_analytics_intent
            columns:
              - column:
                  name: createdBy
                  type: varchar(255)
  - changeSet:
      id: v2026.3.1.155-04-chat_analytics_intent-lastModifiedBy
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: chat_analytics_intent
                columnName: lastModifiedBy
      changes:
        - addColumn:
            tableName: chat_analytics_intent
            columns:
              - column:
                  name: lastModifiedBy
                  type: varchar(255)
