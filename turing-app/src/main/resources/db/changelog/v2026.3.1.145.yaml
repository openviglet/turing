databaseChangeLog:
  # --- T1329: per-site masking of personal data in stored search terms ---
  # Nullable: null follows turing.search.metrics.mask-personal-data, 1 masks, 0 keeps
  # the term as typed. Existing sites stay null, so nothing changes until a site sets
  # it. Idempotent: gated by columnExists.
  - changeSet:
      id: v2026.3.1.145-01-sn-site-metrics-mask-personal-data
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: sn_site
                columnName: metricsMaskPersonalData
      changes:
        - addColumn:
            tableName: sn_site
            columns:
              - column:
                  name: metricsMaskPersonalData
                  type: int
