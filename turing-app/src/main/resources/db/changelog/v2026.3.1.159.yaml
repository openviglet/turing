databaseChangeLog:
  # --- T1322j: the MCP client moves into the llm module ---
  # The MCP server registry is tool-connection infrastructure every AI module reads
  # (ADR 0005 section 6), so its table takes the llm_ prefix under the T1317 rule.
  # Idempotent: runs only while the old table exists and the new one does not.
  - changeSet:
      id: v2026.3.1.159-01-rename-mcp_server
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: mcp_server
        - not:
            - tableExists:
                tableName: llm_mcp_server
      changes:
        - renameTable:
            oldTableName: mcp_server
            newTableName: llm_mcp_server
