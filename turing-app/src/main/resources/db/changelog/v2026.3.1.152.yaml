databaseChangeLog:
  # --- T1319: optimistic locking on custom tools, integrations and the thesaurus ---
  # The version Hibernate's @Version compares on save. Existing rows start at 0.
  # Idempotent: each changeSet is gated by columnExists.
  - changeSet:
      id: v2026.3.1.152-01-custom-tool-version
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: agent_custom_tool
                columnName: version
      changes:
        - addColumn:
            tableName: agent_custom_tool
            columns:
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
  - changeSet:
      id: v2026.3.1.152-02-integration-instance-version
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: system_integration_instance
                columnName: version
      changes:
        - addColumn:
            tableName: system_integration_instance
            columns:
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
  - changeSet:
      id: v2026.3.1.152-03-knowledge-base-version
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: kb_knowledge_base
