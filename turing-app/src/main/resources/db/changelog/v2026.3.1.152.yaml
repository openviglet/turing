                  constraints:
                    nullable: false
  - changeSet:
      id: v2026.3.1.152-04-microthesaurus-version
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: kb_microthesaurus
                columnName: version
      changes:
        - addColumn:
            tableName: kb_microthesaurus
            columns:
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
