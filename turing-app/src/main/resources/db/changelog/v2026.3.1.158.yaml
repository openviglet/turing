databaseChangeLog:
  # --- T1322d: chat merged into the agent module ---
  # chat is the agent's conversation state (ADR 0005 section 6), so its one table takes
  # the agent_ prefix under the T1317 rule. Idempotent: runs only while the old table
  # exists and the new one does not.
  - changeSet:
      id: v2026.3.1.158-01-rename-chat_analytics_intent
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: chat_analytics_intent
        - not:
            - tableExists:
                tableName: agent_analytics_intent
      changes:
        - renameTable:
            oldTableName: chat_analytics_intent
            newTableName: agent_analytics_intent
