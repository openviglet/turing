        - column:
            name: microthesaurusId
            type: varchar(255)
            constraints:
              nullable: false
        - column:
            name: enabled
            type: boolean
            defaultValueBoolean: true
            constraints:
              nullable: false
        - column:
            name: sn_site_id
            type: varchar(255)
            constraints:
              nullable: false
    - addUniqueConstraint:
        tableName: kb_sn_site_microthesaurus
        columnNames: sn_site_id, microthesaurusId
        constraintName: uk_sn_site_microthesaurus
    - createIndex:
        tableName: kb_sn_site_microthesaurus
