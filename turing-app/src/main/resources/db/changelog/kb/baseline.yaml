# T1321 / ADR 0005 — the kb module's schema baseline: the squash of the 2026.3
# history, generated from a fresh replay of it. Changes after the baseline go in new
# files next to this one and are never edited once they may have run.
databaseChangeLog:
- changeSet:
    id: kb_knowledge_base
    author: turing
    changes:
    - createTable:
        tableName: kb_knowledge_base
        columns:
        - column:
            name: id
            type: varchar(255)
            constraints:
              primaryKey: true
              primaryKeyName: pk_kb_knowledge_base
              nullable: false
        - column:
            name: name
            type: varchar(255)
            constraints:
              nullable: false
        - column:
            name: description
            type: varchar(2000)
        - column:
            name: source
            type: varchar(20)
            defaultValue: USER
            constraints:
              nullable: false
        - column:
            name: tenantId
            type: varchar(40)
        - column:
            name: creationDate
            type: timestamp
        - column:
            name: lastModifiedDate
            type: timestamp
        - column:
            name: version
            type: bigint
            defaultValueNumeric: '0'
            constraints:
              nullable: false
        - column:
            name: createdBy
            type: varchar(255)
        - column:
            name: lastModifiedBy
            type: varchar(255)
