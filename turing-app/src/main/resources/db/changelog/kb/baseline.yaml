    author: turing
    changes:
    - createTable:
        tableName: kb_sn_site_microthesaurus
        columns:
        - column:
            name: id
            type: varchar(255)
            constraints:
              primaryKey: true
              primaryKeyName: pk_kb_sn_site_microthesaurus
