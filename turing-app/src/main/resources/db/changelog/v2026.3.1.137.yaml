databaseChangeLog:
  # T1157 / §CLVIII.1 — what a site's chat retrieval searches on a follow-up turn.
  #   followupQueryMode — LATEST_ONLY (default ⇒ the latest message alone, as before),
  #                       JOINED (last user turns joined) or REWRITE (LLM standalone
  #                       question). Read by the SN chat and the catalog copilot.
  #
  # camelCase per the project's literal JPA naming convention; idempotent via
  # columnExists + onFail:MARK_RAN.
  - changeSet:
      id: v2026.3.1.137-add-sn_site_genai-followupQueryMode
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: sn_site_genai
        - not:
            - columnExists:
                tableName: sn_site_genai
                columnName: followupQueryMode
      changes:
        - addColumn:
            tableName: sn_site_genai
            columns:
              - column:
                  name: followupQueryMode
                  type: varchar(16)
                  defaultValue: LATEST_ONLY
                  constraints:
                    nullable: false
                  remarks: "T1157 follow-up retrieval mode: LATEST_ONLY, JOINED or REWRITE."
