# T1321 / ADR 0005 — the rag module's schema baseline: the squash of the 2026.3
# history, generated from a fresh replay of it. Changes after the baseline go in new
# files next to this one and are never edited once they may have run.
databaseChangeLog:
- changeSet:
    id: rag_answer_share
    author: turing
    changes:
    - createTable:
        tableName: rag_answer_share
        columns:
        - column:
            name: id
            type: varchar(40)
            constraints:
              primaryKey: true
              primaryKeyName: pk_rag_answer_share
              nullable: false
        - column:
            name: site_name
            type: varchar(255)
            constraints:
              nullable: false
        - column:
            name: query
            type: varchar(2000)
            constraints:
              nullable: false
        - column:
            name: filters_json
            type: longtext
        - column:
            name: answer_text
            type: longtext
        - column:
            name: sources_json
            type: longtext
        - column:
            name: citations_json
            type: longtext
        - column:
            name: answered_at
            type: timestamp
        - column:
            name: creation_date
            type: timestamp
