databaseChangeLog:
  # T1341 — gateway batch input files.
  #
  # POST /v1/files (purpose=batch) stores the client's JSONL here until a
  # POST /v1/batches names it; the batch itself is a batch_job row (T156) and its
  # output is read back from the vendor on request, so only input files are kept.
  # keyId is the uploading gateway key (null in open mode), which owns the file.
  #
  # Idempotent: gated by tableExists not present.

  - changeSet:
      id: v2026.3.1.160-create-llm_gateway_batch_file
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: llm_gateway_batch_file
      changes:
        - createTable:
            tableName: llm_gateway_batch_file
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: keyId
                  type: varchar(36)
              - column:
                  name: filename
                  type: varchar(255)
              - column:
                  name: purpose
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: bytes
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: lineCount
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: longtext
                  constraints:
                    nullable: false
              - column:
                  name: createdAt
                  type: timestamp
                  constraints:
                    nullable: false
