name: Publish @viglet/turing-sdk

# Publishes the vanilla, zero-dependency JavaScript SDK to npm (T876).
# The workflow picks the version itself: scripts/bump-patch.mjs moves
# package.json to the next patch npm has not seen (a local bump that has not
# shipped is kept), and the bump is committed back after the publish. The
# build + bundle-size budget + tests run as a publish gate.
on:
  workflow_dispatch:

permissions:
  contents: write
  # npm trusted publishing (OIDC): without this GitHub mints no ID token, pnpm
  # skips OIDC and the PUT falls back to an unauthenticated 404.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          registry-url: "https://registry.npmjs.org"
          scope: "@viglet"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install workspace deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      # Bumps from the versions npm holds, not from package.json alone: a version
      # published but never committed here made the publish 403 on a re-dispatch.
      - name: Bump @viglet/turing-sdk (next unpublished patch)
        working-directory: frontend
        run: node scripts/bump-patch.mjs packages/sdk

      - name: Build @viglet/turing-sdk
        working-directory: frontend
        run: pnpm --filter "@viglet/turing-sdk..." run build

      - name: Bundle-size budget (publish gate)
        working-directory: frontend
        run: pnpm --filter "@viglet/turing-sdk" run size

      - name: Test (publish gate)
        working-directory: frontend
        run: pnpm --filter "@viglet/turing-sdk" run test

      # T923 — the last gate before the tarball leaves: no test, story or map
      # file in it, and every declared entry point present. This check exists
      # because of three publish defects (T915, T919, T920) and until now ran
      # only in validate-js.yml, which is to say nowhere near a publish.
      - name: Publish contents (publish gate)
        working-directory: frontend
        run: pnpm --filter "@viglet/turing-sdk" run contents

      - name: Publish to npm
        working-directory: frontend/packages/sdk
        # T914 — `pnpm publish`, never `npm publish`: npm does not rewrite pnpm's
        # `workspace:` protocol, so a package that grows a workspace dependency would
        # ship an unresolvable range. `--no-git-checks` because actions/checkout
        # leaves a detached HEAD, which pnpm's branch check rejects, and the bump
        # above leaves the tree dirty.
        # Authenticates through the npm trusted publisher (OIDC), not a token.
        run: pnpm publish --access public --no-git-checks

      - name: Commit version bump
        run: |
          git add frontend/packages/sdk/package.json
          git commit -m "chore: bump @viglet/turing-sdk [skip ci]" || echo "No changes to commit"
          git push
