name: Publish GitHub Pages

on:
  workflow_dispatch:
    inputs:
      # T1273: the browser half of the viglet.org hub contract (Playwright, in
      # frontend/apps/site/e2e). The deterministic half always runs inside
      # build:site (scripts/check-contract.mjs). Manual dispatch only, never a
      # push or pull-request trigger.
      browser_checks:
        description: "Run the Playwright site/docs contract checks before deploying"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      # The docs-style lint (frontend/apps/docs/scripts/docs-style.test.mjs): a page that
      # breaks a style rule fails here, with its page, line and rule, before anything ships.
      - name: Lint the docs pages
        working-directory: frontend
        run: pnpm test:docs

      - name: Build Storybook
        working-directory: frontend
        run: pnpm run build-storybook:react-sdk
        env:
          # The site owns the root of turing.viglet.org (vite.config.ts base "/").
          STORYBOOK_BASE: /react-sdk/

      - name: Build marketing site (root)
        working-directory: frontend
        run: pnpm run build:site
        env:
          # Wire the hero search + cited-chat demos to the public read-only demo
          # instance so they are genuinely LIVE in production (Block AB T478),
          # grounded in Turing's own docs seed (T483 dogfood). Without these the
          # deployed widgets silently fall back to scripted/sample data.
          VITE_TURING_DEMO_URL: https://turing-demo.viglet.org
          VITE_TURING_DEMO_SITE: turing-docs

      # Deterministic checks first: a failure there is a product regression and stops the
      # deploy. External destinations follow with bounded retries; a network error or a bot
      # wall is annotated "inconclusive" in the report rather than failing (e2e/external.spec.ts).
      - name: Browser contract checks
        if: ${{ inputs.browser_checks }}
        working-directory: frontend/apps/site
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run e2e
          EXTERNAL_LINKS=1 pnpm run e2e:external

      - name: Upload the browser check report and screenshots
        if: ${{ always() && inputs.browser_checks }}
        uses: actions/upload-artifact@v4
        with:
          name: site-contract-report
          path: frontend/apps/site/playwright-report
          retention-days: 14

      - name: Package Marketplace examples
        working-directory: frontend
        run: pnpm run package:marketplace

      - name: Assemble site
        run: |
          # Marketing site (React/Vite) at the root — includes index.html,
          # hashed assets and the static files from apps/site/public
          # (robots.txt, sitemap.xml, llms.txt, favicons).
          mkdir -p _site
          cp -r frontend/apps/site/dist/* _site/

          # Storybook
          mkdir -p _site/react-sdk
          cp -r frontend/packages/react-sdk/storybook-static/* _site/react-sdk/

          # Marketplace manifest
          mkdir -p _site/marketplace
          cp frontend/apps/marketplace/marketplace.json _site/marketplace/

          # Per-project artifacts + marketing docs
          for app_dir in frontend/apps/marketplace/*/; do
            project=$(basename "$app_dir")
            mkdir -p "_site/marketplace/$project"
            cp "$app_dir"*.zip                     "_site/marketplace/$project/" 2>/dev/null || true
            cp "$app_dir"dist/turing-manifest.json "_site/marketplace/$project/" 2>/dev/null || true

            # Marketing README + landing page live outside the workspace, in turing-marketplace/
            legacy="turing-marketplace/$project"
            [ -f "$legacy/index.html" ] && cp "$legacy/index.html" "_site/marketplace/$project/"
            if [ -f "$legacy/README.md" ]; then
              cp "$legacy/README.md" "_site/marketplace/$project/"
            else
              cp "$app_dir/README.md" "_site/marketplace/$project/" 2>/dev/null || true
            fi
          done

      # Served at https://turing.viglet.org/ with the Pages source set to "GitHub
      # Actions": this job deploys the artifact itself, no branch in between. The
      # custom domain lives in the repo's Pages settings, so no CNAME file is needed.
      # T1256: the WordPress Playground demo under /playground/, the blueprint and the three zips
      # its URLs name (the plugin, the Tarnfell theme, the catalog seed). Playground downloads them
      # from the visitor's browser, and Pages sends the CORS headers a release does not. Built in
      # the same deploy as the site, so /wp-demo and the files it opens always agree.
      - name: Build the JS SDK the plugin ships
        working-directory: frontend
        run: pnpm --filter "@viglet/turing-sdk..." run build

      - name: Build the WordPress Playground demo
        working-directory: wordpress
        run: |
          npm ci --no-audit --no-fund
          npm run build
          sh bin/build-playground.sh ../_site/playground
          for file in blueprint.json viglet-turing-search.zip tarnfell.zip tarnfell-demo.zip; do
            test -s "../_site/playground/$file" || { echo "playground/$file is missing"; exit 1; }
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Ping IndexNow (Bing -> ChatGPT search, Copilot, DuckDuckGo) with every
      # sitemap URL. Waits for Pages to serve the key file; never fails the job.
      - name: Notify IndexNow
        continue-on-error: true
        run: node frontend/apps/site/scripts/indexnow.mjs https://turing.viglet.org 0216f1cfab96c7e0be9434d12adbcc16
