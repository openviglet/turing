# Builds the Viglet Turing Docker image from the root Dockerfile and pushes
# it to the GitHub Container Registry (ghcr.io). The Dockerfile is multi-stage
# and self-contained (it clones + builds the source itself), so this workflow
# only needs Docker Buildx — no JDK/Node/Maven setup. For more information see:
# https://docs.github.com/en/actions/publishing-packages/publishing-docker-images
#
# T1113 — two modes, so `latest` can no longer fall months behind the releases:
#   - release: publish.yml calls this after it cuts a release, tagging the
#     released version and moving `latest` to it (default branch only). A
#     manual dispatch with `version` set does the same by hand.
#   - snapshot: a manual dispatch from a version branch tags `<branch>-snapshot`
#     plus the commit sha. It never touches `latest` or a version tag, because
#     the branch's pom already names the LAST release and would overwrite it.
# Both stay on demand: no push/tag trigger (CI is manual-dispatch, T928/T929).

name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to tag and move latest to (blank = <branch>-snapshot)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: "Released version to tag (e.g. 2026.3.6); makes this a release publish"
        type: string
        required: true
      commit:
        description: "Commit the release landed on, baked in as TURING_BUILD_COMMIT"
        type: string
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openviglet/turing

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve mode, version and commit
        id: cfg
        env:
          # Bind inputs to env vars (never interpolate them into the script body).
          IN_VERSION: ${{ inputs.version }}
          IN_COMMIT: ${{ inputs.commit }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          COMMIT="${IN_COMMIT:-$DISPATCH_SHA}"
          if [ -n "$IN_VERSION" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$IN_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short=${COMMIT:0:7}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        env:
          # GHCR links the package to the repo from the INDEX annotation (buildx
          # pushes an index with a provenance attestation), not the image LABEL.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.cfg.outputs.release == 'true' && github.ref_name == github.event.repository.default_branch }}
            type=raw,value=${{ steps.cfg.outputs.version }},enable=${{ steps.cfg.outputs.release == 'true' }}
            type=raw,value=${{ github.ref_name }}-snapshot,enable=${{ steps.cfg.outputs.release != 'true' }}
            type=raw,value=sha-${{ steps.cfg.outputs.short }}
      # T1358 - never publish an image that cannot boot on its own defaults. Build it
      # into the local daemon first, start it with no JAVA_OPTS under a 1 GB memory
      # limit (the smallest host the docs promise) and wait for the startup line. The
      # push below reuses this build's layer cache, so the image is not rebuilt.
      - name: Build image for the boot check
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          provenance: false
          tags: turing-boot-check:local
          build-args: |
            REPO_BRANCH=${{ github.ref_name }}
            CACHE_BUST=${{ steps.cfg.outputs.commit }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
      - name: Boot the image on its own heap
        run: |
          set -uo pipefail
          docker run -d --name turing-boot-check --memory 1g \
            -e TURING_AI_CRYPTO_KEY=boot-check-only \
            turing-boot-check:local
          for i in $(seq 1 60); do
            if docker logs turing-boot-check 2>&1 | grep -q "Started TuringES"; then
              echo "Booted after ~$((i * 5)) s"
              docker rm -f turing-boot-check >/dev/null
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' turing-boot-check)" != "true" ]; then
              echo "::error::The image exited before it finished starting"
              break
            fi
            sleep 5
          done
          docker logs --tail 200 turing-boot-check 2>&1
          docker rm -f turing-boot-check >/dev/null
          echo "::error::Turing did not report 'Started TuringES' within 300 s under a 1 GB limit with no JAVA_OPTS"
          exit 1
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            REPO_BRANCH=${{ github.ref_name }}
            CACHE_BUST=${{ steps.cfg.outputs.commit }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
